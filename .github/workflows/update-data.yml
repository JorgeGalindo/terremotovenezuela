name: Actualizar datos Copernicus

# Regenera los datos de la activación EMSR884 a diario y, si cambian, los
# commitea. La integración Git de Vercel redesplega automáticamente al push.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC cada día
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerar datos EMSR884
        run: npm run fetch:all

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos de Copernicus."
          else
            git commit -m "Datos: actualización automática EMSR884 ($(date -u +%F))"
            git push
            echo "Datos actualizados y enviados; Vercel redesplegará."
          fi

name: Actualizar datos

# A diario: regenera los datos de Copernicus (EMSR884).
# Si algo cambia, hace commit; la integración Git de Vercel redesplega sola.
#
# DESCONTINUADO (ago-2026): el paso "personas" usaba la API de Anthropic (Claude
# con web_search) y era el único componente de pago del proyecto. Se ha retirado
# del cron y el secret ANTHROPIC_API_KEY se ha borrado del repo. El script sigue
# en scripts/update-personas.mjs por si se quiere lanzar a mano con una key
# propia (`ANTHROPIC_API_KEY=... npm run update:personas`), pero NO corre en CI.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC cada día
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Regenerar datos Copernicus (EMSR884)
        run: npm run fetch:all

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos: actualización automática ($(date -u +%F))"
            git push
            echo "Datos actualizados y enviados; Vercel redesplegará."
          fi

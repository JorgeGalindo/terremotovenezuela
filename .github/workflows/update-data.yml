name: Actualizar datos

# A diario: regenera los datos de Copernicus (EMSR884) y, si hay ANTHROPIC_API_KEY,
# refresca también las cifras de personas (Claude + web search + APIs de registros).
# Si algo cambia, hace commit; la integración Git de Vercel redesplega sola.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC cada día
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Regenerar datos Copernicus (EMSR884)
        run: npm run fetch:all

      - name: Actualizar cifras de personas (Claude + APIs)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run update:personas

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos: actualización automática ($(date -u +%F))"
            git push
            echo "Datos actualizados y enviados; Vercel redesplegará."
          fi
